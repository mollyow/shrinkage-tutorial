schema_version: 1
registry_version: 4
registry_date: "2026-09-01"
status: four_fresh_studies_have_eligible_locked_analyses_portfolio_gate_b_passed

selection_policy:
  outcome_blind_scope: "No new outcome values, learner comparisons, effect estimates, or interaction results may be used for enrollment or locking."
  developmental_studies_count_toward_gate_b: false
  required_fresh_study_families: 4
  minimum_respondent_clusters: 1000
  minimum_respondent_tasks: 5000
  required_portfolio_properties:
    minimum_substantive_domains: 3
    multinational_study: true
    rating_outcome: true
    paired_choice_outcome: true
    product_assignment: true
    restricted_or_nonproduct_assignment: true
    minimum_rich_covariate_studies: 3
  independent_unit: study_family
  nested_units_not_counted_separately:
    - country
    - wave
    - outcome
    - experimental_arm
  primary_attention_check_filter_allowed: false

eligibility_requirements:
  - original_or_author_endorsed_public_archive
  - persistent_identifier_and_explicit_reuse_license
  - immutable_file_checksum
  - respondent_task_and_profile_position_identifiers_or_deterministic_reconstruction
  - reconstructible_assignment_probabilities_and_support
  - documented_covariate_timing
  - supported_prespecified_whole_interaction_family
  - respondent_clustered_outer_and_inner_folds
  - outcome_blind_design_contract

