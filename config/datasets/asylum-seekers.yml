decision:
  gate: B
  result: green
  meaning: "Both waves have reconstructible product-randomized profile support, explicit profile-side identifiers, adequate respondent clusters, a conservative eight-variable pre-outcome covariate tier, and three identified whole interaction families."
  outcome_blind: true
  permitted_next_actions:
    - freeze_contract_and_hashes
    - implement_shared_supported_contrast_constructor
    - define_outcome_specific_pair_retention_without_inspecting_values
  prohibited_actions:
    - read_outcome_values
    - fit_outcome_models
    - inspect_effects_or_learner_performance

