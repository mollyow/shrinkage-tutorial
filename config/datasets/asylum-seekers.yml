attributes:
  testimony_consistency:
    column: cconsist
    levels: ["No inconsistencies", "Minor inconsistencies", "Major inconsistencies"]
  applicant_gender:
    column: cgender
    levels: ["Female", "Male"]
  origin:
    column: corigin
    levels: ["Syria", "Afghanistan", "Kosovo", "Eritrea", "Pakistan", "Ukraine", "Iraq"]
  applicant_age:
    column: cage
    levels: ["21 Years", "38 Years", "62 Years"]
  occupation:
    column: cjob
    levels: ["Unemployed", "Cleaner", "Farmer", "Accountant", "Teacher", "Doctor"]
  vulnerability:
    column: cvulner
    levels: ["None", "PTSD", "Victim of torture", "No surviving family", "Handicapped"]
  migration_reason:
    column: creason
    levels_by_wave:
      wave_2016: ["Political persecution", "Religious persecution", "Ethnic persecution", "Economic opportunities"]
      wave_2022: ["Political persecution", "Religious persecution", "Ethnic persecution", "Economic opportunities", "War"]
  religion:
    column: creligion
    levels: ["Christian", "Agnostic", "Muslim"]
  language:
    column: clang
    levels: ["Fluent", "Broken", "None"]

support:
  type: complete_cartesian_product_within_wave
  structural_zeros: none
  all_36_attribute_pairs_complete: true
  profiles:
    wave_2016: 136080
    wave_2022: 170100
  common_wave_support:
    rule: "For direct 2016-versus-2022 rating comparisons, remove War from the focal-profile target. For forced choice, condition both focal and opponent profiles to non-War; removing only focal War leaves the 2022 opponent environment different from 2016."
    profiles: 136080

assignment:
  reconstruction_status: prospectively_documented_nonrestricted_uniform_randomization_and_realized_support_verified_no_platform_generator_released
  row_marginal_law:
    wave_2016: "Independent uniform draws over the nine wave-2016 attribute level sets; q_2016(a)=1/136080."
    wave_2022: "Independent uniform draws over the nine wave-2022 attribute level sets; q_2022(a)=1/170100."
  within_pair_profile_law: "Independent fully randomized profiles, q_w x q_w, as documented by the study; no source or realized-assignment discrepancy was found."
  across_tasks_joint_law: "The source says values were randomized across respondents and profiles; inference nevertheless allows arbitrary within-respondent dependence and uses respondent-level folds."
  profile_side_source: "prof explicitly records sides 1 and 2 within tasks A through E."
  frame_2022:
    mechanism: randomized_at_beginning_of_survey_before_conjoint
    levels: [general, mediterranean, afghanistan, ukraine]
    assignment_probability: "1/4 for each frame"
    realized_counts:
      archive: {general: 3709, mediterranean: 3809, afghanistan: 3730, ukraine: 3728}
      design_complete: {general: 3706, mediterranean: 3807, afghanistan: 3728, ukraine: 3725}

target:
  primary:
    respondent_population: "Equal-weight mixture of the 15 countries; within country, use the released age-gender-education entropy-balancing weight, trimmed by the authors at 6."
    profiles: wave_specific_uniform_product_assignment_q
    frames_2022: uniform_one_quarter_mixture
    waves: "Estimate each wave separately; treat 2016 as the primary wave and 2022 as a nested temporal replication, not as two independent studies."
  cross_wave:
    profiles: uniform_product_on_common_support_without_war
    countries: equal_weight_over_same_15_countries
  sensitivities:
    - observed_country_sample_mixture
    - unweighted_design_complete_respondents
    - author_alt_weight
    - frame_specific_2022_results

covariates:
  timing_rule: "Primary learners use immutable demographics and the three attitudes documented before the conjoint. Employment, income, ideology, and all feeling-thermometer, cosmopolitanism, nationalism, alliance, and threat measures were elicited later and are excluded from primary learners. The 2016 order is strongly supported by the preregistration's questionnaire-reuse statement but its original instrument is not released."
  preprocessing: "Within each outer training fold, learn numerical scaling and imputation. Use the globally locked, outcome-blind category universe only to keep columns aligned across folds."
  primary_raw: [cty, gender, age, home_born, educ_EISCED, asy_change_home, asy_change_europe, immig_change_home]
  feature_semantics:
    cty:
      semantic_type: unordered_categorical
      primary_encoding: full_one_hot_all_locked_levels_no_reference_drop
      missing_value_rule: explicit_missing_level
      scaling_rule: none
    gender:
      semantic_type: unordered_categorical
      primary_encoding: full_one_hot_all_locked_levels_no_reference_drop
      missing_value_rule: explicit_missing_level
      scaling_rule: none
    age:
      semantic_type: continuous
      primary_encoding: numeric
      missing_value_rule: fold_training_median_plus_indicator
      scaling_rule: fold_training_median_and_iqr
    home_born:
      semantic_type: binary_categorical
      primary_encoding: full_one_hot_all_locked_levels_no_reference_drop
      missing_value_rule: explicit_missing_level
      scaling_rule: none
    educ_EISCED:
      semantic_type: ordered_category_treated_as_categorical
      primary_encoding: full_one_hot_all_locked_levels_no_reference_drop
      missing_value_rule: explicit_missing_level
      scaling_rule: none
    asy_change_home:
      semantic_type: ordered_category_treated_as_categorical
      primary_encoding: full_one_hot_all_locked_levels_no_reference_drop
      missing_value_rule: explicit_missing_level
      scaling_rule: none
    asy_change_europe:
      semantic_type: ordered_category_treated_as_categorical
      primary_encoding: full_one_hot_all_locked_levels_no_reference_drop
      missing_value_rule: explicit_missing_level
      scaling_rule: none
    immig_change_home:
      semantic_type: ordered_category_treated_as_categorical
      primary_encoding: full_one_hot_all_locked_levels_no_reference_drop
      missing_value_rule: explicit_missing_level
      scaling_rule: none
  randomized_context:
    frame: "For 2022, include frame as an unpenalized context input or fit frame-specific nuisances and integrate with weight 1/4; do not treat it as a background covariate."
  post_conjoint_sensitivity_only: [emp_status, inc_decile]
  exclude_post_conjoint:
    - feel_therm_*
    - ideo
    - cosmo_*
    - nat_*
    - eu_view
    - nato_view
    - rus_*
    - nato_intervene
  never_features: [ResponseId, weight, alt_weight]
  age_rule: "Keep ages 16 and 17 because voting eligibility differs across countries. Treat age above 110 as implausible and missing, add an indicator, and impute/scale inside each outer fold; retain the respondent and report a raw-age sensitivity."

estimands:
  definition: "For each factor pair, use the saturated pair-cell space under the wave-specific uniform target, orthogonally projected away from the intercept and both main-effect spaces."
  coordinate_basis: deterministic_target_weighted_orthonormal
  families:
    - id: reason_x_vulnerability
      attributes: [migration_reason, vulnerability]
      dimension_by_wave:
        wave_2016: 12
        wave_2022: 16
        common_support: 12
      status: identified_locked
    - id: religion_x_origin
      attributes: [religion, origin]
      dimension_by_wave:
        wave_2016: 12
        wave_2022: 12
        common_support: 12
      status: identified_locked
    - id: occupation_x_language
      attributes: [occupation, language]
      dimension_by_wave:
        wave_2016: 10
        wave_2022: 10
        common_support: 10
      status: identified_locked
  primary_family_dimensions:
    wave_2016: 34
    wave_2022: 38
    common_support: 34
  rule: "Keep every coordinate in each registered family; do not select favorable coordinates after outcomes are opened."

folds:
  cluster: ResponseId
  outer: respondent_level_5_fold
  inner: respondent_level_5_fold_within_each_outer_training_sample
  outer_folds: 5
  inner_folds: 5
  deterministic_seed: 20260901
  stratification: wave_x_country
  frame_2022: balance_across_folds_where_feasible
  no_row_leakage: required

gate_tests:
  - all_locked_file_checksums_match
  - forbidden_outcomes_never_loaded
  - exact_wave_sample_counts_reproduced
  - exact_country_counts_reproduced
  - complete_or_all_missing_profile_blocks_only
  - five_tasks_and_two_explicit_profile_sides_per_design_complete_respondent
  - exact_wave_specific_level_sets_match
  - every_attribute_pair_has_full_cartesian_support
  - assignment_frequency_diagnostics_are_compatible_with_uniform_levels
  - survey_weights_are_positive_finite_and_respondent_level
  - frame_is_complete_and_has_four_locked_levels_in_2022
  - whole_family_projector_ranks_equal_locked_dimensions
  - deterministic_bases_are_target_orthonormal_and_remove_main_effects
  - no_outcome_model_is_fit
