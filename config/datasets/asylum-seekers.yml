read_barrier:
  conjoint_allowed_columns:
    - ResponseId
    - task
    - prof
    - cconsist
    - cgender
    - corigin
    - cage
    - cjob
    - cvulner
    - creason
    - creligion
    - clang
  respondent_allowed_columns:
    common:
      - ResponseId
      - asy_change_home
      - asy_change_europe
      - immig_change_home
      - cty
      - gender
      - age
      - home_born
      - educ_EISCED
      - emp_status
      - inc_decile
      - ideo
      - weight
      - alt_weight
    wave_2022:
      - frame
  forbidden_outcomes:
    - pref
    - rate
    - ratebin
  rule: "The design audit must use data.table::fread(select=...) on each source file. It must never load a complete conjoint file and remove the outcomes afterward."

