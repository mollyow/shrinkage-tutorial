schema_version: 1
contract_version: 1
contract_date: "2026-09-01"
study_id: immigrant_admission
status: conditional_design_lock_outcomes_prohibited

decision:
  gate: B
  result: amber
  meaning: "Released-support estimands are identified, but outcome analysis remains blocked until the archive/article support discrepancy and uncertified within-pair opponent law are explicitly resolved or prospectively assumed."
  outcome_blind: true
  permitted_next_actions:
    - seek_author_or_randomizer_confirmation
    - declare_released_implementation_authoritative_and_adopt_q_times_q_within_pair_assumption
  prohibited_actions:
    - read_outcome_values
    - fit_outcome_models
    - inspect_effects_or_learner_performance

provenance:
  article:
    title: "The Hidden American Immigration Consensus: A Conjoint Analysis of Attitudes toward Immigrants"
    doi: "https://doi.org/10.1111/ajps.12138"
  archive:
    doi: "https://doi.org/10.7910/DVN/25505"
    version: "2.1"
    license: CC0-1.0
    limitation: "The three-file archive contains no survey-platform generator, full questionnaire, or profile-side field."
  files:
    zip:
      path: "Candidate recruitment/data/hainmueller_hopkins.zip"
      bytes: 208760
      md5: "63405f4ae7aac0b4b738081cf8b708dc"
    data:
      path: "Candidate recruitment/data/hainmueller_hopkins/repdata.dta"
      bytes: 2845890
      md5: "2848ba036c769c5a5816b6d13608b0dd"
    estimates_code:
      path: "Candidate recruitment/data/hainmueller_hopkins/rep_estimates.do"
      bytes: 27274
      md5: "047dd6ec356069cdb2b4c6abc771eb2d"
