      - u_journalists
      - u_banProtest
      - u_execRule
      - u_court
      - u_limitVote
      - u_gerry2
      - u_gerry10
    labels:
      - Pooled generic conduct
      - Threaten journalists
      - Ban protest
      - Rule by executive order
      - Ignore unfavorable court rulings
      - Limit polling places
      - Gerrymander for two extra seats
      - Gerrymander for ten extra seats
  focal_party:
    column: c_party
    codes: [D, R]
    labels: [Democrat, Republican]
  contest_relation:
    derived_column: contest_relation
    source_columns: [c_party, o_party]
    codes: [same, cross]
    labels: [Same-party contest, Cross-party contest]
  focal_gender:
    column: c_sex
    codes: [Female, Male]
    labels: [Female, Male]

assignment:
  reconstruction_status: exact_current_task_coarsened_law_from_source_randomization_blocks
  democracy_behavior:
    generic: "4/11"
    each_undemocratic_behavior: "1/11"
  focal_party:
    D: "1/2"
    R: "1/2"
  contest_relation:
    same: "6/13"
    cross: "7/13"
  ordered_party_pair:
    DD: "3/13"
    RR: "3/13"
    DR: "7/26"
    RD: "7/26"
  focal_gender:
    Female: "3/8"
    Male: "5/8"
  factorization: "q(D,P,R,S)=q_D(D)q_P(P)q_R(R)q_S(S), supported by the source's independently randomized attribute blocks."
  opponent_democracy: "Generic in every retained candNum==1 task."
  across_tasks: blocked_without_replacement_with_arbitrary_within_respondent_dependence
  actual_display_sequence: not_released
  mean_no_carryover: "Conditional on baseline variables, the current focal and opponent profiles, and current task context, the mean current paired-choice response is unaffected by profiles assigned in earlier displays."

target:
  respondents: "Released experimental population, using the supplied survey weight normalized over the 1,682 enrolled respondents."
  causal_factors: uniform_over_8_by_2_by_2_by_2_supported_cells
  target_cell_probability: "1/64"
  remaining_randomized_context: "Outcome-blind empirical standardization over policy fields, opponent generic behavior, opponent demographics, randomized left/right placement, match number, and other released current-task fields."
  causal_interpretation: "Effects of supported coarsened contest configurations, not freely set arbitrary candidate profiles."

excluded_complete_profile_factors:
  fields: [c_age, o_age, c_exper, o_exper, c_pro, o_pro]
  role: audit_and_empirical_standardization_only
  reasons:
    profession: "The source probability list sums to 0.90 and omits Police officer, which appears at about ten percent in the release."
    experience: "The supplement states age minus a uniform integer from 20 to 30; released age-minus-experience values are 23 through 33 with an undocumented endpoint pattern."
    age: "Kept out of the causal target with its dependent experience field because the joint generator is not released and the experience rule conflicts with the data."

