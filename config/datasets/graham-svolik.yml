estimands:
  name: target_weighted_coarsened_democracy_interaction_families
  fixed_before_outcomes: true
  families:
    - id: democracy_x_focal_party
      attributes: [democracy_behavior, focal_party]
      cells: 16
      interaction_rank: 7
      expected_minimum_cell_count: 830
    - id: democracy_x_contest_relation
      attributes: [democracy_behavior, contest_relation]
      cells: 16
      interaction_rank: 7
      expected_minimum_cell_count: 750
    - id: democracy_x_focal_gender
      attributes: [democracy_behavior, focal_gender]
      cells: 16
      interaction_rank: 7
      expected_minimum_cell_count: 606
  total_dimension: 21
  inference_scope: fixed_finite_family_coordinates_and_joint_tests_only

folds:
  cluster: id
  outer_folds: 5
  deterministic_seed: 20260901
  rule: "Hash and balance complete respondent IDs only. Every task for one respondent stays in exactly one fold. Any inner tuning split is created inside an outer training set from respondent IDs only."

