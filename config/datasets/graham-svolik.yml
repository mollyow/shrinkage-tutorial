protocol:
  endpoint_lock: "The paired-choice endpoint remains unopened until folds, learners, equivalence margins, and cross-study reporting code are frozen."
  prospective_endpoint_rule:
    primary: c_win
    row: "The selected candNum == 1 nonvalence core row."
    missingness: "Only after the common benchmark is frozen, retain a task for the primary endpoint when c_win is observed. Report the number and proportion missing overall and by all four treatment components before fitting any learner."
    held_endpoint: c_vote
    prohibition: "The design audit must not read either endpoint; c_vote remains outside the primary benchmark unless separately promoted before any endpoint values are opened."
  pre_audit_deviation:
    occurred: true
    description: "During initial archive inspection, a shell head command inadvertently displayed one complete experiment row, including four binary response values."
    quarantine: "The row was not summarized, used for enrollment or estimand selection, supplied to a learner, or used in an effect calculation. No further response row may be opened during this gate."
    reporting_rule: "Retain this disclosure in every manifest and in the eventual paper. Do not describe the full project history as having zero response values viewed."

