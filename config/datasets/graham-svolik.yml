  task_id: matchNum
  orientation: "Use candNum == 1, which designates the undemocratic candidate in U/G tasks and the source focal candidate in G/G tasks."
  enrollment_rule: "Retain every respondent in the released randomized experiment. Remove the two negative-valence tasks using only c_dem_type/o_dem_type; do not filter on choices, attention, speed, or post-choice fields."
  expected:
    released_respondents: 1682
    released_task_rows: 43732
    released_tasks: 21866
    released_tasks_per_respondent: 13
    mirrored_rows_per_task: 2
    primary_respondents: 1682
    primary_tasks: 18502
    primary_tasks_per_respondent: 11
    omitted_valence_tasks: 3364
    covariate_rows: 1691
    linked_covariate_ids: 1682
    covariate_rows_with_missing_experiment_id: 9
  source_count_discrepancy:
    supplement_wave2_completers: 1692
    article_respondents: 1691
    article_choices: 21604
    released_complete_experiment_ids: 1682
    resolution: "The cohort is all 1,682 complete IDs in the released randomized experiment; the nine covariate rows without experiment IDs are not repaired or enrolled."

factors:
