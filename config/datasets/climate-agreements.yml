  rating_result: conditional_green_under_mean_no_opponent_and_no_carryover_restrictions
  paired_choice_result: amber_exact_opponent_law_not_certified
  meaning: "The archive, prospectively reconstructed rowwise uniform product assignment, support, covariates, and three whole interaction families are locked. Paired-choice analysis remains blocked because the global iid task-pair model is strongly disfavored and the archive contains no generator for the exact opponent law. A rating-only analysis is eligible only under the locked row-law reconstruction plus the prospectively declared mean-no-opponent and mean-no-carryover restrictions."
  outcome_blind: true
  permitted_next_actions:
    - freeze_contract_and_hashes
    - seek_author_or_randomizer_confirmation
    - implement_rating_only_pipeline_with_mean_no_opponent_and_no_carryover_restrictions
    - sensitivity_check_uniform_ordered_distinct_pair_law_without_outcomes
  prohibited_actions:
    - read_outcome_values
    - fit_outcome_models
    - inspect_effects_or_learner_performance
    - encode_q_times_q_as_the_known_pair_law

