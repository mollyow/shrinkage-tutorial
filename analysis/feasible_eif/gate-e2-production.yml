      residual_rho: 0.80
      carryover: lag_only
      scale: local
      radius_multiplier_r: 1.00
      aligned_nuisance_error: true
      score_mean_learner: task_specific_additive_ols
      covariance_mean_learner: task_specific_saturated_16_profile_cell_means
      rescue_score_mean_learners:
        - task_specific_saturated_16_profile_cell_means
        - oracle_correct_own_task_mean

hard_correctness_pass_rules:
  evaluate_each_applicable_cell_separately: true
  maximum_numerical_failure_rate: 0.00
  dropped_replications_allowed: 0
  maximum_calibration_residual: 0.0000000001
  exact_bias:
    maximum_absolute_discrepancy_in_mc_standard_deviations: 0.10
    maximum_absolute_paired_mc_z: 3.50
  local_amse:
    empirical_to_theory_ratio_min: 0.90
    empirical_to_theory_ratio_max: 1.10
    local_scaling_pair_max_relative_difference: 0.15
  least_favourable_oracle_adaptive_to_ordinary_mse:
    r_0_5_max: 0.90
    r_1_min: 0.90
    r_1_max: 1.10
    r_2_min: 1.10
    r_3_min: 1.10
  ordinary_inference:
    primary_coverage_min: 0.925
    primary_coverage_max: 0.975
    maximum_absolute_standardized_bias: 0.10
    sandwich_to_mc_variance_min: 0.90
    sandwich_to_mc_variance_max: 1.10
  selected_null_and_blind_inference:
    primary_coverage_min: 0.925
    primary_coverage_max: 0.975
    maximum_absolute_standardized_bias: 0.10
    sandwich_to_mc_variance_min: 0.90
    sandwich_to_mc_variance_max: 1.10
  oracle_bias_aware_primary_coverage_min: 0.93
  hausman_directional:
    null_and_blind_rejection_min: 0.03
    null_and_blind_rejection_max: 0.07
    oracle_power_absolute_error_max: 0.04
    selected_power_absolute_error_max: 0.06
    r_1_power_max: 0.25
    r_2_power_min: 0.40
  assignment_error:
    both_directions_mandatory: true
    combined_decomposition_mandatory: true
    rescue_methods_mandatory:
      - wrong_assignment_saturated_mean
      - wrong_assignment_oracle_mean
    oracle_mean_rescue_maximum_absolute_standardized_bias: 0.10
    oracle_mean_rescue_coverage_min: 0.925
    oracle_mean_rescue_coverage_max: 0.975
    saturated_mean_rescue_maximum_absolute_standardized_bias: 0.10
    saturated_mean_rescue_coverage_min: 0.925
    saturated_mean_rescue_coverage_max: 0.975

practical_value_pass_rules:
  evaluated_only_if_hard_correctness_passes: true
  evaluate_each_applicable_cell_separately: true
  feasible_bias_aware_primary_coverage_min: 0.93
  structured_lag:
    primary_coverage_min: 0.93
    median_length_ratio_to_unrestricted_max: 1.00
  oracle_tau_mm:
    applies_to: product_local_least_favourable_cells
    amse_denominator: minimum_of_ordinary_and_oracle_adaptive
    paired_bootstrap_upper_97_5_max: 0.98
  feasible_tau_generic:
    applies_to: correct_assignment_carryover_cells
    amse_denominator: minimum_of_ordinary_and_selected
    each_point_ratio_max: 1.05
    r_1_least_favourable_upper_97_5_max: 0.98
  null_selected_efficiency:
    selected_to_ordinary_variance_ratio_max: 0.90
    paired_bootstrap_upper_97_5_max: 0.98

required_descriptive_outputs:
  - all_coordinate_bias_and_coverage
  - omnibus_hausman_size_and_power
  - standard_selected_coverage_under_carryover
  - interval_widths
  - selector_frequencies
  - fixed_departure_inconsistency
  - unrestricted_oracle_joint_efficiency
  - assignment_error_predicted_and_empirical_bias

pivot_rules:
  hard_correctness_failure: stop_full_sensitivity_methods_route_and_debug_or_retract_failed_claim
  hard_pass_practical_fail: retain_unrestricted_primary_and_exact_geometry_but_pivot_to_theory_or_benchmark_note
  assignment_only_failure: restrict_claims_to_verified_joint_assignment_and_remove_assignment_uncertainty_claims
  both_pass: proceed_to_full_methods_paper_with_ordinary_inference_primary
