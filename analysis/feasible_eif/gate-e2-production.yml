version: 3
gate: E2_computational_carryover_sensitivity
mode: production
status: frozen_after_preproduction_and_completion_audit
frozen_on: "2026-08-27"
amended_before_valid_production_on: "2026-08-27"
preproduction_amendments:
  - leave_two_inner_covariance_fit_removes_selector_outcome_leakage
  - assignment_independent_outer_folds_restore_literal_foldwise_unbiasedness
  - support_safe_empty_cell_rule_avoids_assignment_conditioned_rerandomization
  - saturated_rescue_variance_includes_cell_mean_first_order_influence
  - production_replications_raised_from_1000_to_3000_for_simultaneous_cellwise_mc_precision
  - inner_anchors_cover_observed_outer_support_and_use_frozen_fallback_elsewhere
invalidated_partial_runs_may_not_be_combined: true
seed: 2026082731
replications_per_scenario: 3000
monte_carlo_bootstrap_draws: 4000
monte_carlo_bootstrap_seed: 2026082732
common_random_numbers_across_methods: true

decision_structure:
  hard_correctness_separate_from_practical_value: true
  ordinary_taskwise_inference_primary: true
  smoke_can_make_gate_decision: false
  favorable_cell_averaging_allowed: false

estimand:
  factors: 4
  levels_per_factor: 2
  profiles: 16
  target: uniform_complete_factorial
  coordinates:
    - x1_x2
    - x1_x3
    - x2_x4
    - x1_x2_x3
  true_coefficients: [0.18, -0.14, 0.11, 0.08]
  primary_direction:
    coordinate: x1_x2
    vector: [1.0, 0.0, 0.0, 0.0]
  task_weights: uniform
  truth_definition: recompute_Eq_H0_transpose_m_for_every_scenario
  dependent_assignment_interpretation: q_specific_task_marginal_target

reference_design:
  tasks: 8
  assignment_support_size: 16
  default_true_assignment: product
  default_analysis_assignment: product
  assignment_marginal: uniform
  default_residual_covariance:
    class: compound_symmetry
    rho: 0.80
    marginal_variance: 1.0
  outcome_noise_scale: 1.0
  own_task_mean_surface: dense_factorial_with_task_drift
  default_score_mean_learner: task_specific_saturated_16_profile_cell_means
  default_covariance_mean_learner: task_specific_saturated_16_profile_cell_means
  residual_metric: conditional_residual_precision

carryover_construction:
  task_metric: M_equals_Sigma_inverse
  local_parameterization: m_G_equals_B_gamma_plus_r_over_sqrt_TG_times_unit_departure
  local_radius_for_c: r_over_sqrt_T
  local_radius_for_m_G: r_over_sqrt_TG
  least_favourable_unit_departure: T_Sigma_Dstar_a_over_sqrt_aKa
  least_favourable_direction: primary_direction
  lag_unit_departure:
    base: centered_previous_profile_primary_factorial_score
    first_task_value: 0
    projection: M_projection_off_no_carryover_mean_space
    normalization: epsilon_M_equals_1
  blind_unit_departure:
    base: lag_one_temporal_map_times_unused_x3_x4_score
    projection: kernel_of_complete_four_coordinate_Dstar_bias_map
    normalization: epsilon_M_equals_1
    maximum_pre_simulation_vector_bias: 0.0000000001
    require_positive_norm: true
  fixed_departure_epsilon: 0.10

assignment_error_construction:
  applies_to_scenario_class: assignment_error
  carryover_null_means_no_conditional_mean_carryover: true
  nuisance_error_space: interaction_only_orthogonal_to_additive_learner
  alignment: leading_primary_direction_image_of_L_minus_Cq
  directional_noncentrality: 1.5
  require_nonzero_analytic_headroom_before_simulation: true
  post_result_rescaling_forbidden: true

estimator:
  outer_folds: 5
  inner_folds: 4
  fold_unit: respondent
  saturated_mean_support:
    outer_folds_assignment_independent: true
    inner_support_anchors: outcome_blind_greedy_set_cover_excluded_from_inner_validation
    minimum_task_profile_count_in_every_training_sample: 1
    empty_outer_cell_rule: task_training_overall_mean
    observed_cell_rule: exact_empirical_cell_mean
    empty_cell_events_recorded: true
  covariance_moment: uncentered_inner_crossfitted_residual_second_moment
  selector_covariance_crossfit: leave_selector_and_covariance_validation_folds_out
  covariance_classes:
    - compound_symmetry
    - unstructured
  covariance_eigenvalue_relative_floor: 0.00000001
  gate_d_blend_grid: [0.25, 0.50, 0.75, 1.00]
  selector: one_standard_error
  selector_loss: mean_coordinate_cluster_score_variance
  selector_tie_break: lower_blend_then_compound_symmetry
  ordinary_always_candidate: true
  all_learning_uses_outer_training_only: true
  standard_errors: respondent_cluster_sandwich
  confidence_level: 0.95
  hausman_covariance: direct_paired_respondent_score_difference
  hausman_used_for_estimator_selection: false

methods:
  - id: ordinary_taskwise
    role: confirmatory_unrestricted
    feasible: true
  - id: oracle_unrestricted_joint
    role: unattainable_unrestricted_efficiency_benchmark
    feasible: false
  - id: selected_adaptive
    role: gate_d_feasible_restricted
    feasible: true
  - id: oracle_adaptive
    role: exact_restricted_Hstar_benchmark
    feasible: false
  - id: oracle_tau_0_25
    role: fixed_oracle_blend
    tau: 0.25
    feasible: false
  - id: oracle_tau_0_50
    role: fixed_oracle_blend
    tau: 0.50
    feasible: false
  - id: oracle_tau_0_75
    role: fixed_oracle_blend
    tau: 0.75
    feasible: false
  - id: oracle_tau_1_00
    role: fixed_oracle_blend
    tau: 1.00
    feasible: false
  - id: oracle_tau_mm
    role: sensitivity_indexed_oracle_blend
    local_least_favourable_formula: one_over_one_plus_r_squared
    feasible: false
  - id: feasible_tau_generic
    role: directional_E1_24b_blend
    inputs: outer_training_C0D_VD_K
    clipping_interval: [0.0, 1.0]
    feasible: true
  - id: selected_adaptive_correct_assignment
    role: assignment_error_correct_law_control
    applies_to: assignment_error
    feasible: true
  - id: selected_adaptive_wrong_assignment
    role: assignment_error_test
    applies_to: assignment_error
    feasible: true
    score_mean_learner: task_specific_additive_ols
  - id: wrong_assignment_saturated_mean
    role: feasible_outcome_regression_rescue_test
    applies_to: assignment_error
    score_mean_learner: task_specific_saturated_16_profile_cell_means
    feasible: true
  - id: wrong_assignment_oracle_mean
    role: outcome_regression_rescue_test
    applies_to: assignment_error
    feasible: false

method_roles:
  ordinary: ordinary_taskwise
  restricted: oracle_adaptive
  selected: selected_adaptive
  oracle_blend: oracle_tau_mm
  feasible_blend: feasible_tau_generic

intervals:
  standard_cluster: true
  bias_aware_primary_direction:
    form: estimate_plus_minus_z_se_plus_minus_epsilon_sqrt_aKa
    oracle_K: true
    feasible_direct_K: true
  lag_structured:
    unrestricted_ball_K: true
    prespecified_lag_subspace_KZ: true
  simultaneous_family_results: descriptive

exact_bias_prediction:
  correct_assignment_formula: Eq_D_transpose_m
  wrong_assignment_formula: L_minus_Cq_times_eta_minus_gamma_plus_Eq_H_transpose_delta
  average_across_folds_by: held_out_respondent_count
  assignment_expectations: cached_exact_pair_or_triple_profile_moments
  realized_outcomes_or_assignments_used_in_prediction: false

simulation:
  default_respondents: 500
  default_tasks: 8
  scenarios:
    - id: null_cs_product
      class: "null"
      respondents: 500
      true_assignment: product
      analysis_assignment: product
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: none
    - id: lf_r0_5_cs_product
      class: local_least_favourable
      respondents: 500
      true_assignment: product
      analysis_assignment: product
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: least_favourable
      scale: local
      radius_multiplier_r: 0.50
    - id: lf_r1_cs_product_g250
      class: local_least_favourable
      respondents: 250
      true_assignment: product
      analysis_assignment: product
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: least_favourable
      scale: local
      radius_multiplier_r: 1.00
      local_scaling_pair: product_r1
    - id: lf_r1_cs_product_g1000
      class: local_least_favourable
      respondents: 1000
      true_assignment: product
      analysis_assignment: product
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: least_favourable
      scale: local
      radius_multiplier_r: 1.00
      local_scaling_pair: product_r1
    - id: lf_r2_cs_product
      class: local_least_favourable
      respondents: 500
      true_assignment: product
      analysis_assignment: product
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: least_favourable
      scale: local
      radius_multiplier_r: 2.00
    - id: lf_r3_cs_product
      class: local_least_favourable
      respondents: 500
      true_assignment: product
      analysis_assignment: product
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: least_favourable
      scale: local
      radius_multiplier_r: 3.00
    - id: lag_r1_cs_product
      class: local_lag
      respondents: 500
      true_assignment: product
      analysis_assignment: product
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: lag_only
      scale: local
      radius_multiplier_r: 1.00
    - id: lag_r1_ar1_product
      class: local_lag
      respondents: 500
      true_assignment: product
      analysis_assignment: product
      residual_covariance: ar1
      residual_rho: 0.70
      carryover: lag_only
      scale: local
      radius_multiplier_r: 1.00
    - id: blind_r2_cs_product
      class: local_blind
      respondents: 500
      true_assignment: product
      analysis_assignment: product
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: blind
      scale: local
      radius_multiplier_r: 2.00
    - id: fixed_lf_e0_10_cs_product
      class: fixed_least_favourable
      respondents: 500
      true_assignment: product
      analysis_assignment: product
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: least_favourable
      scale: fixed
      epsilon_M: 0.10
    - id: lf_r1_cs_wor_correct
      class: local_least_favourable
      respondents: 500
      true_assignment: uniform_without_replacement
      analysis_assignment: uniform_without_replacement
      assignment_support_size: 16
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: least_favourable
      scale: local
      radius_multiplier_r: 1.00
    - id: qerr_product_as_wor_null
      class: assignment_error
      respondents: 500
      true_assignment: product
      analysis_assignment: uniform_without_replacement
      assignment_support_size: 16
      residual_covariance: compound_symmetry
      residual_rho: 0.80
      carryover: none
      aligned_nuisance_error: true
      score_mean_learner: task_specific_additive_ols
      covariance_mean_learner: task_specific_saturated_16_profile_cell_means
      rescue_score_mean_learners:
        - task_specific_saturated_16_profile_cell_means
        - oracle_correct_own_task_mean
    - id: qerr_wor_as_product_null
      class: assignment_error
      respondents: 500
      true_assignment: uniform_without_replacement
      analysis_assignment: product
      assignment_support_size: 16
      residual_covariance: compound_symmetry
      residual_rho: 0.80
