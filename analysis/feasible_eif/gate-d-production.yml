version: 1
mode: production
status: frozen_before_gate_d_simulation
frozen_on: "2026-08-27"
seed: 2026082711
replications_per_scenario: 2000
monte_carlo_bootstrap_draws: 4000
monte_carlo_bootstrap_seed: 2026082712

estimand:
  factors: 4
  levels_per_factor: 2
  profiles: 16
  target: uniform_complete_factorial
  coordinates:
    - x1_x2
    - x1_x3
    - x2_x4
    - x1_x2_x3
  true_coefficients: [0.18, -0.14, 0.11, 0.08]
  task_weights: uniform

estimator:
  outer_folds: 5
  inner_folds: 4
  fold_unit: respondent
  mean_learner: task_specific_additive_ols
  covariance_moment: uncentered_inner_crossfitted_residual_second_moment
  covariance_classes:
    - compound_symmetry
    - unstructured
  covariance_eigenvalue_relative_floor: 0.00000001
  blend_grid: [0.25, 0.50, 0.75, 1.00]
  selector: one_standard_error
  selector_loss: mean_coordinate_cluster_score_variance
  selector_tie_break: lower_blend_then_compound_symmetry
  ordinary_always_candidate: true
  covariance_and_selector_use_outer_training_only: true
  standard_errors: respondent_cluster_sandwich
  confidence_level: 0.95

simulation:
  default_respondents: 500
  outcome_noise_scale: 1.0
  mean_surface: dense_factorial_with_task_drift
  assignment_marginal: uniform
  scenarios:
    - id: strong_cs_moderate_product
      class: strong_headroom
      respondents: 500
      tasks: 4
      assignment: product
      covariance: compound_symmetry
      rho: 0.50
    - id: strong_cs_high_product
      class: strong_headroom
      respondents: 500
      tasks: 8
      assignment: product
      covariance: compound_symmetry
      rho: 0.80
    - id: strong_ar1_product
      class: strong_headroom
      respondents: 500
      tasks: 8
      assignment: product
      covariance: ar1
      rho: 0.70
    - id: strong_cs_high_without_replacement
      class: strong_headroom
      respondents: 500
      tasks: 8
      assignment: uniform_without_replacement
      covariance: compound_symmetry
      rho: 0.80
    - id: strong_cs_moderate_small_sample
      class: strong_headroom
      respondents: 250
      tasks: 8
      assignment: product
      covariance: compound_symmetry
      rho: 0.50
    - id: weak_independence
      class: weak_headroom_safety
      respondents: 500
      tasks: 8
      assignment: product
      covariance: compound_symmetry
      rho: 0.00
    - id: weak_positive
      class: weak_headroom_safety
      respondents: 500
      tasks: 8
      assignment: product
      covariance: compound_symmetry
      rho: 0.10
    - id: negative_correlation
      class: covariance_robustness
      respondents: 500
      tasks: 8
      assignment: product
      covariance: compound_symmetry
      rho: -0.10
    - id: profile_heteroskedastic_cs
      class: covariance_robustness
      respondents: 500
      tasks: 8
      assignment: product
      covariance: profile_scaled_compound_symmetry
      rho: 0.60
      log_sd_coefficient: 0.35

pass_rules:
  strong_each_point_variance_ratio_max: 0.90
  strong_each_upper_97_5_max: 0.98
  strong_each_oracle_gain_recovered_min: 0.50
  weak_aggregate_variance_ratio_max: 1.05
  safety_each_point_variance_ratio_max: 1.10
  selected_coverage_min: 0.93
  selected_coverage_max: 0.97
  ordinary_coverage_min: 0.93
  ordinary_coverage_max: 0.97
  rms_standardized_bias_max: 0.10
  sandwich_variance_calibration_min: 0.90
  sandwich_variance_calibration_max: 1.10
  maximum_calibration_residual: 0.0000000001
  maximum_invariance_error: 0.0000000001
  maximum_numerical_failure_rate: 0.00

application:
  role: supporting_non_gating
  dataset: candidate_recruitment
  assignment_scenarios:
    - documented_product_uniform
    - ordered_uniform_without_replacement
  desired_point_variance_ratio_max: 0.90
  desired_upper_97_5_max: 0.98
  note: "A different application with a documented joint randomizer may replace this illustration without changing the Gate-D decision."

pivot_rule:
  on_failure: "Do not claim a generally useful feasible covariance-adaptive estimator. Retain the oracle geometry and exact calibration theory; simplify to a technical note or redesign the selector before a new frozen gate."
